services:
  - type: web
    name: dont-try-bot
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: CHANNEL_USERNAME
        value: "@i_dont_try"
